<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuizyMath - Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <div class="admin-container">
    <div class="admin-card admin-login-card">
      <h1 class="admin-title">🔐 Admin Login</h1>
      <p class="admin-subtitle">Restricted area. Sign in with an admin account.</p>

      <form id="adminLoginForm">
        <input name="email" type="email" placeholder="Admin email" required autocomplete="username" />
        <input name="password" type="password" placeholder="Password" required autocomplete="current-password" />
        <button type="submit">Login</button>
      </form>

      <p id="adminLoginMsg" class="admin-msg"></p>
    </div>
  </div>

  <script>
    const ADMIN_API_BASE = "__ADMIN_API_BASE__";
    const ADMIN_PANEL_BASE = "__ADMIN_PANEL_BASE__";

    document.getElementById("adminLoginForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const msg = document.getElementById("adminLoginMsg");
      msg.textContent = "";
      msg.className = "admin-msg";

      const email = this.querySelector('input[name="email"]').value.trim();
      const password = this.querySelector('input[name="password"]').value;

      try {
        const res = await fetch(`/api/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || "Login failed");

        // نفس نظام تسجيل الدخول العادي، بس هنا بنشترط إن الحساب role admin
        if (!data.user || data.user.role !== "admin") {
          throw new Error("This account doesn't have admin access.");
        }

        localStorage.setItem("adminToken", data.token);
        localStorage.setItem("adminName", data.user.name);
        window.location.href = `${ADMIN_PANEL_BASE}/dashboard`;
      } catch (err) {
        msg.textContent = "❌ " + err.message;
        msg.classList.add("admin-msg-error");
      }
    });
  </script>
</body>
</html>
