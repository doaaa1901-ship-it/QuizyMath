<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Workspace & Geometry Canvas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #012b1a;
        }

        /* --- THE WRITING PAPER CANVAS --- */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
            background-color: #fbfdfa;
            background-size: 30px 30px;
            background-image: linear-gradient(to right, rgba(0, 70, 44, 0.06) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(0, 70, 44, 0.06) 1px, transparent 1px);
        }

        /* Workspace Controls Top Bar Overlay */
        .workspace-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .workspace-title {
            background: rgba(1, 43, 26, 0.95);
            color: #6ad7a8;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* --- SHAPE TOOLBAR --- */
        .toolbar {
            display: flex;
            gap: 8px;
            background: rgba(1, 43, 26, 0.9);
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(106, 215, 168, 0.2);
        }

        .tool-btn {
            background: #194236;
            color: #e6f0ec;
            border: 1px solid transparent;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .tool-btn:hover {
            background: #235c4b;
            color: #6ad7a8;
        }

        .tool-btn.active {
            background: #6ad7a8;
            color: #012b1a;
            border-color: #fff;
            box-shadow: 0 0 8px rgba(106, 215, 168, 0.6);
        }

        .clear-btn {
            background: #9c4141;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .clear-btn:hover { background: #bd4f4f; }

        /* --- FLOATING CALCULATOR ICON (TOP RIGHT) --- */
        #calc-toggle-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 55px;
            height: 55px;
            background: #194236;
            color: #6ad7a8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border: 2px solid rgba(106, 215, 168, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #calc-toggle-icon:hover {
            background: #6ad7a8;
            color: #012b1a;
            transform: scale(1.1) rotate(15deg);
        }

        /* --- SLIDE-IN POPUP CALCULATOR PANEL --- */
        #calculator-panel {
            position: absolute;
            top: 90px;
            right: -350px;
            width: 320px;
            background: rgba(1, 43, 26, 0.95);
            backdrop-filter: blur(10px);
            border: 2px solid #6ad7a8;
            border-radius: 16px;
            padding: 20px;
            z-index: 90;
            box-shadow: -5px 10px 30px rgba(0,0,0,0.5);
            transition: right 0.4s cubic-bezier(0.075, 0.82, 0.165, 1);
        }

        #calculator-panel.open {
            right: 20px;
        }

        .calc-screen {
            width: 100%;
            height: 60px;
            background: #0d1a15;
            border: 1px solid rgba(106, 215, 168, 0.3);
            border-radius: 8px;
            color: #6ad7a8;
            text-align: right;
            padding: 10px;
            font-size: 1.6rem;
            font-family: monospace;
            margin-bottom: 15px;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .calc-btn {
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            background: #194236;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .calc-btn:hover {
            background: rgba(255,255,255,0.1);
            color: #6ad7a8;
        }

        .calc-btn.operator {
            color: #6ad7a8;
            background: #0d261f;
        }

        .calc-btn.clear { background: #9c4141; }
        .calc-btn.clear:hover { background: #bd4f4f; }

        .calc-btn.equal {
            background: #6ad7a8;
            color: #012b1a;
            grid-column: span 2;
        }
        .calc-btn.equal:hover { background: #8ffbd0; }
    </style>
</head>
<body>

    <!-- Top Left Controls Layout Stack -->
    <div class="workspace-ui">
        <div class="header-row">
            <div class="workspace-title" id="page-title">📝 Math Workspace</div>
            <button class="clear-btn" onclick="clearCanvas()">Clear Paper 🗑️</button>
        </div>
        
        <!-- Shape & Angle Drawing Panel -->
        <div class="toolbar">
            <button class="tool-btn active" id="tool-free" onclick="setTool('free')">✏️ Free Draw</button>
            <button class="tool-btn" id="tool-rect" onclick="setTool('rect')">🟦 Rectangle</button>
            <button class="tool-btn" id="tool-circle" onclick="setTool('circle')">⚪ Circle</button>
            <button class="tool-btn" id="tool-triangle" onclick="setTool('triangle')">📐 Triangle</button>
            <button class="tool-btn" id="tool-angle" onclick="setTool('angle')">🔄 Angle Arc</button>
        </div>
    </div>

    <!-- Floating Trigger Icon (Top Right) -->
    <div id="calc-toggle-icon" onclick="toggleCalculator()">🖩</div>

    <!-- Slide-Out Full Calculator Widget Panel -->
    <div id="calculator-panel">
        <input type="text" id="calc-display" class="calc-screen" readonly value="0">
        <div class="calc-grid">
            <button class="calc-btn clear" onclick="pressClear()">C</button>
            <button class="calc-btn operator" onclick="pressOp('(')">(</button>
            <button class="calc-btn operator" onclick="pressOp(')')">)</button>
            <button class="calc-btn operator" onclick="pressOp('/')">÷</button>
            
            <button class="calc-btn" onclick="pressNum('7')">7</button>
            <button class="calc-btn" onclick="pressNum('8')">8</button>
            <button class="calc-btn" onclick="pressNum('9')">9</button>
            <button class="calc-btn operator" onclick="pressOp('*')">×</button>
            
            <button class="calc-btn" onclick="pressNum('4')">4</button>
            <button class="calc-btn" onclick="pressNum('5')">5</button>
            <button class="calc-btn" onclick="pressNum('6')">6</button>
            <button class="calc-btn operator" onclick="pressOp('-')">-</button>
            
            <button class="calc-btn" onclick="pressNum('1')">1</button>
            <button class="calc-btn" onclick="pressNum('2')">2</button>
            <button class="calc-btn" onclick="pressNum('3')">3</button>
            <button class="calc-btn operator" onclick="pressOp('+')">+</button>
            
            <button class="calc-btn" onclick="pressNum('0')">0</button>
            <button class="calc-btn" onclick="pressNum('.')">.</button>
            <button class="calc-btn equal" onclick="pressEqual()">=</button>
        </div>
    </div>

    <!-- Infinite Writing Paper Canvas -->
    <div id="canvas-container">
        <canvas id="paintCanvas"></canvas>
    </div>

    <script>
        let currentTool = 'free';
        let isDrawing = false;
        let startX, startY;
        let snapshotData = null;

        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');

        document.addEventListener("DOMContentLoaded", () => {
            const path = window.location.pathname.toLowerCase();
            const titleEl = document.getElementById('page-title');
            if (path.includes('algebra')) titleEl.innerText = "🧮 Algebra Workspace";
            else if (path.includes('geometry')) titleEl.innerText = "📐 Geometry Workspace";
            else if (path.includes('trig')) titleEl.innerText = "📏 Trigonometry Workspace";
            
            initCanvas();
        });

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tool-${tool}`).classList.add('active');
        }

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            resetCanvasStyling();
        }

        function resetCanvasStyling() {
            ctx.strokeStyle = '#02462c';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        function saveSnapshot() {
            snapshotData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        }

        function restoreSnapshot() {
            if (snapshotData) ctx.putImageData(snapshotData, 0, 0);
        }

        // --- MATH SHAPES & DRAWING CORE ENGINE ---
        function handleStart(x, y) {
            isDrawing = true;
            startX = x;
            startY = y;
            ctx.beginPath();
            
            if (currentTool === 'free') {
                ctx.moveTo(x, y);
            } else {
                saveSnapshot(); // Save background layout state before drawing real-time shape outlines
            }
        }

        function handleMove(x, y) {
            if (!isDrawing) return;

            if (currentTool === 'free') {
                ctx.lineTo(x, y);
                ctx.stroke();
            } else {
                restoreSnapshot(); // Clear frame to redraw live preview bounding boxes seamlessly
                ctx.beginPath();
                resetCanvasStyling();

                if (currentTool === 'rect') {
                    ctx.strokeRect(startX, startY, x - startX, y - startY);
                } 
                else if (currentTool === 'circle') {
                    let radius = Math.sqrt(Math.pow(x - startX, 2) + Math.pow(y - startY, 2));
                    ctx.arc(startX, startY, radius, 0, 2 * Math.PI);
                    ctx.stroke();
                } 
                else if (currentTool === 'triangle') {
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(x, y);
                    ctx.lineTo(startX - (x - startX), y);
                    ctx.closePath();
                    ctx.stroke();
            } 
            else if (currentTool === 'angle') {
                // Draw the base horizontal line
                ctx.moveTo(startX, startY);
                ctx.lineTo(startX + 120, startY);
                
                // Draw the dynamic secondary line based on pointer location
                ctx.moveTo(startX, startY);
                ctx.lineTo(x, y);
                ctx.stroke();
                
                // Dynamically compute and construct the mathematical angle arc indicator
                let angle = Math.atan2(y - startY, x - startX);
                ctx.beginPath();
                ctx.strokeStyle = '#9c4141'; // Contrasting color for the degree arc marker
                ctx.lineWidth = 2;
                ctx.arc(startX, startY, 40, 0, angle, angle < 0);
                ctx.stroke();
                
                // Calculate and output the readable degree text output overlay
                let degrees = Math.round(angle * (180 / Math.PI));
                if (degrees < 0) degrees += 360;
                ctx.fillStyle = '#012b1a';
                ctx.font = 'bold 12px Segoe UI';
                ctx.fillText(degrees + '°', startX + 50, startY - 10);
            }
        }
    }

    function handleEnd() {
        isDrawing = false;
    }

    // --- MOUSE EVENT LISTENERS ---
    canvas.addEventListener('mousedown', (e) => handleStart(e.clientX, e.clientY));
    canvas.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
    canvas.addEventListener('mouseup', handleEnd);
    canvas.addEventListener('mouseleave', handleEnd);

    // --- MOBILE TOUCH SCREEN LISTENERS ---
    canvas.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        handleStart(touch.clientX, touch.clientY);
        e.preventDefault();
    });
    canvas.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        handleMove(touch.clientX, touch.clientY);
        e.preventDefault();
    });
    canvas.addEventListener('touchend', handleEnd);

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        snapshotData = null;
    }

    // --- POPUP SLIDE CALCULATOR UTILITY LOGIC ---
    function toggleCalculator() {
        const panel = document.getElementById('calculator-panel');
        panel.classList.toggle('open');
    }

    let currentExpr = "";
    const calcDisplay = document.getElementById('calc-display');

    function pressNum(num) {
        if (currentExpr === "0" || currentExpr === "Error") currentExpr = "";
        currentExpr += num;
        calcDisplay.value = currentExpr;
    }

    function pressOp(op) {
        currentExpr += op;
        calcDisplay.value = currentExpr;
    }

    function pressClear() {
        currentExpr = "0";
        calcDisplay.value = currentExpr;
    }

    function pressEqual() {
        try {
            let sanitized = currentExpr.replace(/×/g, '*').replace(/÷/g, '/');
            if(!sanitized) return;
            let result = Function('"use strict"; return (' + sanitized + ')')();
            currentExpr = String(result);
            calcDisplay.value = currentExpr;
        } catch (err) {
            calcDisplay.value = "Error";
            currentExpr = "";
        }
    }

    window.addEventListener('resize', () => {
        const tempImage = canvas.toDataURL();
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        resetCanvasStyling();
        let img = new Image();
        img.src = tempImage;
        img.onload = () => ctx.drawImage(img, 0, 0);
    });
</script>
</body>
</html>
