<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Math App - Login & Sign Up</title>
  <link rel="stylesheet" href="/css/styl.css"/>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <a href="settings.html" class="back-link"></a>
  <div class="container">
    <div class="form-box">
      <img src="/images/Black White Simple Modern Neon Griddy Bold Technology Pixel Electronics Store Logo.png" alt="Math banner" class="banner"/>
      <h2 id="formTitle">Login to MathApp</h2>

      <form id="loginForm">
        <input name="email" type="email" placeholder="Email" required/>
        <input name="password" type="password" placeholder="Password" required/>
        <button type="submit">Login</button>
        <p>Don't have an account? <a href="#" onclick="switchForm('signup')">Sign Up</a></p>
      </form>

      <form id="signupForm" style="display:none;">
        <input name="name" type="text" placeholder="Full Name" required/>
        <input name="email" type="email" placeholder="Email" required/>
        <input name="password" type="password" placeholder="Password" required/>
        <button type="submit">Sign Up</button>
        <p>Already have an account? <a href="#" onclick="switchForm('login')">Login</a></p>
      </form>
    </div>
  </div>

  <script>
    // 🔗 الرابط النسبي السحري المتوافق مع Vercel
    const API_URL = "/api";

    function switchForm(type) {
      const loginForm = document.getElementById("loginForm");
      const signupForm = document.getElementById("signupForm");
      const title = document.getElementById("formTitle");

      if (type === "signup") {
        loginForm.style.display = "none";
        signupForm.style.display = "block";
        title.textContent = "Create Account";
      } else {
        loginForm.style.display = "block";
        signupForm.style.display = "none";
        title.textContent = "Login to MathApp";
      }
    }

    document.getElementById("signupForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const name = this.querySelector('input[name="name"]').value;
      const email = this.querySelector('input[name="email"]').value;
      const password = this.querySelector('input[name="password"]').value;

      try {
        Swal.fire({ title: 'Sending verification...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        const res = await fetch(`${API_URL}/signup`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        Swal.close();

        // نافذة إدخال كود التفعيل المرسل للإيميل
        const { value: code } = await Swal.fire({
          title: "🔢 Enter Verification Code",
          text: `We sent a code to ${email}`,
          input: "text",
          inputPlaceholder: "Enter 6-digit code",
          allowOutsideClick: false,
          confirmButtonText: "Verify",
          showDenyButton: true,
          denyButtonText: "Resend Code"
        });

        if (code) {
          const verifyRes = await fetch(`${API_URL}/verify`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, code })
          });
          const verifyData = await verifyRes.json();
          if (!verifyRes.ok) throw new Error(verifyData.error);
          Swal.fire("🎉 Verified!", "You can now login.", "success");
          switchForm("login");
        }
      } catch (err) {
        Swal.fire("❌ Error", err.message, "error");
      }
    });

    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const email = this.querySelector('input[name="email"]').value;
      const password = this.querySelector('input[name="password"]').value;

      try {
        const res = await fetch(`${API_URL}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        // حفظ بيانات الجلسة بنجاح
        localStorage.setItem("userEmail", data.user.email);
        localStorage.setItem("username", data.user.name);
        localStorage.setItem("profilePhoto", data.user.profilePhoto || '/images/default-profile.png');

        Swal.fire({
          icon: "success",
          title: `👋 Welcome ${data.user.name}!`,
          confirmButtonText: "Continue"
        }).then(() => window.location.href = "index.html");

      } catch (err) {
        Swal.fire("❌ Error", err.message, "error");
      }
    });
  </script>
</body>
</html>
