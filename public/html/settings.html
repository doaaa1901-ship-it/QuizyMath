<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quizy Math | Settings</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    :root {
      --bg1: #1a1f1e; --bg2: #2a3533; --bg3: #394944; --text: #e8ecef; --muted: #b8c2bf; --accent: #6ad7a8; --btn-bg: #2d3c37;
    }
    body { background-color: var(--bg1); color: var(--text); font-family: "Segoe UI", sans-serif; padding: 2rem; }
    .settings-card { background: var(--bg2); border-radius: 16px; padding: 2rem; max-width: 500px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    input[type="text"] { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid var(--bg3); background: var(--bg1); color: var(--text); }
    button { background: var(--accent); color: var(--bg1); border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
  </style>
</head>
<body>

  <div class="settings-card">
    <h2>⚙️ Profile Settings</h2>
    <div style="text-align: center; margin: 15px 0;">
      <img id="preview" src="/images/default-profile.png" style="width:100px; height:100px; border-radius:50%; object-fit:cover;" /><br>
      <input type="text" id="photoUrlInput" placeholder="Paste Image URL here" />
    </div>
    <label>Full Name:</label>
    <input type="text" id="nameInput" placeholder="Enter your name" />
    <button onclick="saveSettings()">Save Configuration</button>
  </div>

  <div id="customAlert" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--bg3); padding:20px; border-radius:12px; border:1px solid var(--accent); text-align:center; z-index:1000;">
    <p id="alertMessage"></p>
    <button id="alertOkBtn" style="margin-top:10px; width:auto;">OK</button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("nameInput").value = localStorage.getItem("username") || "";
      document.getElementById("preview").src = localStorage.getItem("profilePhoto") || "/images/default-profile.png";
      document.getElementById("photoUrlInput").value = localStorage.getItem("profilePhoto") || "";
    });

    document.getElementById("photoUrlInput").addEventListener("input", function() {
      if(this.value.trim() !== "") document.getElementById("preview").src = this.value;
    });

    function saveSettings() {
      const name = document.getElementById("nameInput").value || "Guest";
      const photoSrc = document.getElementById("preview").src;
      const userEmail = localStorage.getItem("userEmail");

      // الحفظ المحلي الفوري السريع
      localStorage.setItem("username", name);
      localStorage.setItem("profilePhoto", photoSrc);

      // تنبيه الحفظ المحلي
      showTimedAlert(`Saving updates...`, 1000, () => {
         // المزامنة الفورية مع الـ Database على السيرفر
         if (userEmail) {
            fetch('/api/user/update', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: userEmail, name: name, profilePhoto: photoSrc })
            })
            .then(res => res.json())
            .then(data => {
                showTimedAlert(`✅ Profile synchronized on Cloud successfully!`, 1500);
            })
            .catch(err => console.error("Cloud sync failed:", err));
         } else {
            showTimedAlert(`✅ Settings saved locally! (Login required for cloud save)`, 2000);
         }
      });
    }

    function showTimedAlert(message, delayMs, onClose) {
      const alertBox = document.getElementById("customAlert");
      const okBtn = document.getElementById("alertOkBtn");
      document.getElementById("alertMessage").textContent = message;

      alertBox.style.display = "block";
      okBtn.disabled = true;

      setTimeout(() => { okBtn.disabled = false; }, delayMs);

      okBtn.onclick = () => {
        alertBox.style.display = "none";
        if (typeof onClose === "function") onClose();
      };
    }
  </script>
</body>
</html>
